baseURL = 'https://kdos.xyz/'
languageCode = 'en-us'
title = 'KDOS'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# ✳️ Taxonomies (adds "series")
[taxonomies]
  category = "categories"
  tag      = "tags"
  series   = "series"

[params]
  env = "production"
  description = "Field notes on craft, code, and the examined life"
  author = "KDOS"

  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "KDOS"
    Content = """
Field notes on building systems that matter — from Linux sovereignty to civic renewal, 
from craft traditions to clear thinking. Reflections organized into series, projects grounded in practice.
    """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourusername"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# 📋 Cleaner, more intentional menu
[menu]
  [[menu.main]]
    name = "Writing"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Series"
    url = "/series/"
    weight = 2

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 5

  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    noClasses = false
    style = "monokai"
